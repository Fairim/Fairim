<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"> <!-- Установка кодировки страницы -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Адаптивность на мобильных устройствах -->
    <title>{% block title %}Мой Магазин{% endblock %}</title> <!-- Блок заголовка страницы, можно переопределить -->

    <!-- Подключение Bootstrap для стилизации -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    {% load catalog_extras %} <!-- Загрузка пользовательских шаблонных тегов (например, format_price) -->

    <style>
        body { padding-top: 20px; } /* Отступ сверху */
        .card-img-top {
            width: 100%;
            height: 200px;
            object-fit: cover; /* Картинка не искажает пропорции, а заполняет контейнер */
        }
        .product-detail-img {
            max-width: 100%;
            height: auto;
            margin-bottom: 15px; /* Отступ снизу у изображения на странице товара */
        }
    </style>
</head>
</html>
