{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Аутентификация пользователя{% endblock %}</title>

  <!-- Bootstrap + иконки -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"  rel="stylesheet">

  <!-- Стили и favicon -->
  <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
  <link rel="stylesheet" href="{% static 'css/catalog.css' %}">

  <!-- Скрипты -->
  <script src="{% static 'js/products.js' %}" defer></script>
</head>
<body>

<!-- Overlay затемнения фона при открытии боковой панели -->
<div class="overlay" id="overlay"></div>

<!-- Хедер -->
<header class="header">
  <div class="container">
    <nav class="navbar">
      <a class="navbar-brand d-flex align-items-center" href="{% url 'main' %}">
        <img src="{% static 'images/logo.png' %}" alt="Логотип" width="200" height="130" class="me-2">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="{% url 'catalog:category_list' %}" class="underline-default">Каталог</a></li>
          <li><a href="{% url 'main' %}#gallery" class="underline-default">Галерея</a></li>
          <li><a href="{% url 'main' %}#about" class="underline-default">О нас</a></li>
          <li><a href="{% url 'main' %}#contacts" class="underline-default">Контакты</a></li>
        </ul>
      </div>
    </nav>
  </div>
</header>

<!-- Основной контент -->
<main class="main-content">
  <div class="container mt-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</main>

<!-- Footer -->
<footer class="footer mt-5">
  <div class="container">
    <p>&copy; 2025 Кузница Стиля. Все права защищены.</p>
  </div>
</footer>

</body>
</html>
